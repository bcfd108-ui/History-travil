name: IndexNow after production
on:
  repository_dispatch:
    types: [vercel.deployment.success, vercel.deployment.promoted]
  workflow_dispatch:
    inputs:
      urls:
        description: "Canonical page URLs separated by spaces. Leave empty to retry the sitemap diff."
        required: false
        type: string

permissions: {}
jobs:
  notify:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'repository_dispatch' &&
       github.event.client_payload.project.id == 'prj_S0xry2ZdFii4kfD37YDvd7CWEt4L' &&
       github.event.client_payload.environment == 'production' &&
       github.event.client_payload.git.sha != '')
    concurrency:
      group: indexnow-onoldground-production
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: write # Only the accepted-URL Git note is pushed.
    env:
      REVISION: ${{ github.event.client_payload.git.sha || github.sha }}
      URLS: ${{ inputs.urls }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REVISION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Read the sitemap built from the deployed commit
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -s .next/server/app/sitemap.xml.body
      - name: Restore accepted URLs
        run: bash app/scripts/indexnow-state.sh restore "$RUNNER_TEMP/indexnow.json"
      - name: Verify the live revision and URL set, then notify IndexNow
        working-directory: app
        run: |
          args=(--expected .next/server/app/sitemap.xml.body --revision "$REVISION" --manifest "$RUNNER_TEMP/indexnow.json")
          if [[ -n "$URLS" ]]; then
            printf '%s\n' "$URLS" | node scripts/indexnow-ping.mjs "${args[@]}" --stdin
          else
            node scripts/indexnow-ping.mjs "${args[@]}" --diff
          fi
      - name: Save accepted batches
        run: bash app/scripts/indexnow-state.sh save "$RUNNER_TEMP/indexnow.json"
      - name: Report a workflow or checkpoint failure
        if: failure()
        run: |
          echo "::error::IndexNow workflow incomplete. Inspect the failed step and re-run. Production has already deployed."
          echo 'IndexNow workflow incomplete. Inspect the failed step and re-run.' >> "$GITHUB_STEP_SUMMARY"
